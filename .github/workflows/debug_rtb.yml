name: Debug RTB House API

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          RTBHOUSE_EMAIL: ${{ secrets.RTBHOUSE_EMAIL }}
          RTBHOUSE_PASSWORD: ${{ secrets.RTBHOUSE_PASSWORD }}
        run: python debug_rtb_api.py
