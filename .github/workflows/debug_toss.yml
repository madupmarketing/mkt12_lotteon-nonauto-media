name: Debug Toss Display Ads

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install selenium
      - env:
          TOSS_COOKIES: ${{ secrets.TOSS_COOKIES }}
        run: python crawlers/toss_display_recon.py
      - name: 스크린샷/HTML 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toss-recon
          path: |
            /tmp/toss_*.png
            /tmp/toss_*.html
          if-no-files-found: ignore
